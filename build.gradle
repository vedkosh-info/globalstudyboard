// Top-level Gradle build for the android-app module ONLY.
// The website is built by Next.js (`npm run build`) and is untouched by Gradle.
buildscript {
    repositories {
        google()
        mavenCentral()
    }
    dependencies {
        classpath 'com.android.tools.build:gradle:8.9.1'
    }
}

allprojects {
    repositories {
        google()
        mavenCentral()
    }
}
